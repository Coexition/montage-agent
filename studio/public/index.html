<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23111%22/%3E%3Cpath d=%22M12 9l11 7-11 7z%22 fill=%22%23fff%22/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/studio/studio.css" />
</head>
<body>
<header class="top">
  <button class="icon-btn" id="versionsBtn" title="Versions">
    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z" opacity=".9"/></svg>
  </button>
  <div class="title-block">
    <div class="title" id="projName">…</div>
    <div class="meta" id="projMeta"></div>
  </div>
  <div class="spacer"></div>
  <select id="versionSel" class="chip-select" title="Version"></select>
  <div class="menu-wrap">
    <button class="icon-btn" id="moreBtn" title="Plus">⋯</button>
    <div class="menu" id="moreMenu" hidden>
      <button data-act="preview">▶︎ Preview live (sans rendu)</button>
      <button data-act="render-draft">⚡ Re-render (draft ½)</button>
      <button data-act="render">🎬 Re-render (final)</button>
      <button data-act="download">⬇︎ Télécharger le MP4</button>
      <button data-act="show-prompt">📋 Voir le prompt</button>
    </div>
  </div>
  <button class="copy-btn" id="copyPrompt" title="Copie tous les feedbacks ouverts dans un prompt pour l'agent">
    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" d="M8 8h11v12H8zM5 16H4V4h12v1"/></svg>
    Copy prompt <span class="count" id="openCount">0</span>
  </button>
</header>

<main class="layout">
  <section class="stage">
    <div class="player-area" id="playerArea">
      <div class="player" id="player">
        <video id="video" playsinline preload="auto"></video>
        <canvas id="draw" class="draw-layer"></canvas>
        <button class="big-play" id="bigPlay" aria-label="Lecture">
          <svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="empty" id="emptyState" hidden>
          <div>Aucun rendu pour l'instant.</div>
          <div class="muted">Lance <code>node engine/render.mjs &lt;projet&gt;</code> — le studio se mettra à jour tout seul.</div>
        </div>
      </div>
      <div class="draw-tools" id="drawTools" hidden>
        <button data-tool="arrow" class="on" title="Flèche (A)">↗</button>
        <button data-tool="rect" title="Rectangle (R)">▭</button>
        <button data-tool="dot" title="Point (D)">●</button>
        <button data-tool="pen" title="Main levée (F)">✎</button>
        <span class="sep"></span>
        <button data-color="#ff3b30" class="sw on" style="--c:#ff3b30"></button>
        <button data-color="#ffd400" class="sw" style="--c:#ffd400"></button>
        <button data-color="#2f7bff" class="sw" style="--c:#2f7bff"></button>
        <button data-color="#22c55e" class="sw" style="--c:#22c55e"></button>
        <button data-color="#ffffff" class="sw" style="--c:#ffffff"></button>
        <span class="sep"></span>
        <button data-act="undo" title="Annuler (⌘Z)">↶</button>
        <button data-act="clear" title="Effacer">✕</button>
      </div>
    </div>

    <div class="timeline" id="timeline">
      <div class="tl-track" id="tlTrack">
        <div class="tl-ticks" id="tlTicks"></div>
        <div class="tl-ranges" id="tlRanges"></div>
        <div class="tl-progress" id="tlProgress"></div>
        <div class="tl-markers" id="tlMarkers"></div>
        <div class="tl-head" id="tlHead"><span></span></div>
      </div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="playBtn" title="Lecture (Espace)">
        <svg viewBox="0 0 24 24" width="18" height="18" id="playIcon"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn" id="restartBtn" title="Revenir au début">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/></svg>
      </button>
      <div class="time"><span id="tCur">00:00.00</span> <span class="muted">/ <span id="tDur">00:00.00</span></span></div>
      <div class="spacer"></div>
      <button class="ctl-btn" id="drawBtn" title="Dessiner sur la frame (P)">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" d="M3 21c3 0 4-2 5-4l9-9-3-3-9 9c-2 1-4 2-4 5zM14 5l3 3"/></svg>
        Draw <kbd>P</kbd>
      </button>
      <button class="ctl-btn" id="speedBtn" title="Vitesse">1×</button>
      <button class="icon-btn" id="muteBtn" title="Son (M)">
        <svg viewBox="0 0 24 24" width="18" height="18" id="volIcon"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
    </div>

    <div class="transcript-card">
      <button class="info" title="Clique un mot pour y aller · sélectionne des mots pour citer un passage (commentaire ou cut)">i</button>
      <div class="transcript" id="transcript"></div>
    </div>
  </section>

  <aside class="side">
    <div class="side-head">
      <h2>Feedback</h2>
      <div class="tabs" id="filterTabs">
        <button data-f="open" class="on">Open <span id="cOpen">0</span></button>
        <button data-f="resolved">Resolved <span id="cRes">0</span></button>
        <button data-f="all">All <span id="cAll">0</span></button>
      </div>
    </div>
    <div class="fb-list" id="fbList"></div>

    <div class="composer" id="composer">
      <div class="composer-top">
        <div class="tabs small" id="kindTabs">
          <button data-k="comment" class="on">
            <svg viewBox="0 0 24 24" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 5h16v11H9l-5 4z"/></svg> Comment</button>
          <button data-k="cut">
            <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="6" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" d="M8.5 7.5 20 18M8.5 16.5 20 6"/></svg> Cut</button>
        </div>
        <div class="spacer"></div>
        <button class="ghost" id="ideasBtn" title="Demander des idées de motion design pour ce passage">✧ Ideas</button>
      </div>
      <div class="at-row">
        <span class="muted" id="atLabel">At</span>
        <button class="time-chip" id="atChip" title="Utiliser le temps courant">
          <svg viewBox="0 0 24 24" width="13" height="13"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" d="M12 7v5l3 2"/></svg>
          <span id="atVal">00:00.00</span>
        </button>
        <span class="muted" id="toLabel" hidden>→</span>
        <button class="time-chip" id="toChip" hidden title="Fin du cut (O)"><span id="toVal">00:00.00</span></button>
        <span class="quote-pill" id="quotePill" hidden></span>
      </div>
      <textarea id="fbText" rows="3" placeholder="Describe what you want to change…"></textarea>
      <div class="attach-row" id="attachRow"></div>
      <div class="composer-bottom">
        <span class="hint"><kbd>C</kbd> write · <kbd>Enter</kbd> add</span>
        <div class="spacer"></div>
        <label class="icon-btn" title="Joindre une image">
          <input type="file" id="fileIn" accept="image/*" hidden multiple />
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="2" d="M20 11.5 12 19.5a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10 17.5a2 2 0 0 1-3-3l7.5-7.5"/></svg>
        </label>
        <button class="add-btn" id="addBtn">Add</button>
      </div>
    </div>
  </aside>
</main>

<div class="toast" id="toast" hidden></div>
<dialog id="promptDlg"><pre id="promptPre"></pre><form method="dialog"><button>Fermer</button></form></dialog>
<script type="module" src="/studio/studio.js"></script>
</body>
</html>
